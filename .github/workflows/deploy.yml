name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Executa toda vez que você enviar código para a branch principal
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente se quiser

permissions:
  contents: read
  pages: write
  id-token: write

# Garante que builds antigos parem se você enviar um código novo em seguida
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências e Compilar
        run: |
          npm install
          npm run build

      - name: Upload do artefato para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Pasta padrão onde o Vite joga o build pronto

      - name: Deploy no GitHub Pages
        uses: actions/deploy-pages@v5
